<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BeKind | Login de voluntário</title>
    <link rel="stylesheet" href="../css/style_voluntariolog.css">
    <link rel="stylesheet" href="../css/comum.css">
    <link rel="icon" href="../img/home/icone.png" type="image/png">

    <script src="../js/script.js" defer></script>
</head>

<body>
    <div class="navbar">
        <div class="logo">
            <a href="home.html"><img src="../img/home/Logo.png" alt="BeKind"></a>
        </div>
        <div class="home">
            <a href="home.html">Home</a>
        </div>
        <div class="sobrenos">
            <a href="sobrenos.html">Sobre Nós</a>
        </div>
        <div class="blog">
            <a href="blog.html">Blog</a>
        </div>
        <div class="doacoes">
            <a href="doacoes.html">Doações</a>
        </div>
        <div class="voluntario">
            <a href="voluntario-cad.html">Voluntário</a></div>
        <div class="eventos">
            <a href="eventos.html">Eventos</a>
        </div>
        <div class="loja">
            <a href="loja/loja.html">Loja</a>
        </div>
        <div class="doe">
            <button class="btn_doe">Doe</button>
        </div>
    </div>

    <div class="mnth-informado">
        <h1>Entrar</h1><br/>

        <form id="form-login" class="form-informado">
            <div class=" input-container">
                <input type="text" id="username" name="nome" class="text-input" autocomplete="off" placeholder="Digite seu nome" required/>
                <label for="username" class="label">Nome do Usuário</label>
            </div>
            <div class=" input-container">
                <input type="password" id="senha" name="senha" class="text-input" autocomplete="off" placeholder="Digite sua senha" minlength="6" required/>
                <label for="senha" class="label">Senha</label>
            </div>
            <input class="enviar" type="submit" value="Entrar">
        </form>
        <a class="link" href="voluntario-cad.html">Não possui login? Cadastre-se!</a>

        <div class="rodape">
            <hr>
            <img class="logo" src="../img/home/logo-black.png" alt="BeKind">
            <h5>Copyright by © BeKind.</h5>
            <h5>Todos os direitos reservados</h5>

            <div class="redes-sociais">
                <a href="#"><img src="../img/home/Facebook.svg" alt="Facebook"></a>
                <a href="#"><img src="../img/home/Twitter.svg" alt="Twitter"></a>
                <a href="#"><img src="../img/home/Linkedin.svg" alt="LinkedIn"></a>
                <a href="#"><img src="../img/home/Insta.svg" alt="Instagram"></a>
            </div>

        </div>
    </div>
</body>

</html>
